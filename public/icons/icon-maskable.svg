<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwaMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="maskShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Full Bleed Background (Required for maskable icons) -->
  <rect width="512" height="512" fill="url(#pwaMaskGrad)"/>

  <!-- Logo Icon Graphics within 80% Safe Zone -->
  <g filter="url(#maskShadow)" transform="scale(0.85) translate(45, 45)">
    <!-- Terminal / Tool Chevron -->
    <path d="M154 180L230 256L154 332" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Underscore Cursor -->
    <path d="M282 332H358" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
    <!-- Glowing Accent Dot -->
    <circle cx="336" cy="180" r="24" fill="#93C5FD"/>
  </g>
</svg>
